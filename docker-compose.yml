services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sdi
      POSTGRES_PASSWORD: sdi_dev_only
      POSTGRES_DB: sdi_channel
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdi -d sdi_channel"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
